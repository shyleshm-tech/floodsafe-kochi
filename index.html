```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FloodSafe Kochi</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef4f7;
color:#17232d;
}

header{
background:linear-gradient(135deg,#063b5c,#087f8c);
color:white;
padding:20px;
}

header h1{
margin:0;
}

header p{
margin:7px 0 0;
}

.container{
max-width:1200px;
margin:auto;
padding:16px;
}

.controls{
background:white;
padding:16px;
border-radius:14px;
box-shadow:0 3px 12px #0002;

display:grid;
grid-template-columns:1fr 1.4fr 1fr;

gap:12px;
}

label{
display:block;
font-size:12px;
font-weight:bold;
margin-bottom:6px;
color:#52616b;
}

input,
select,
button{
width:100%;
padding:12px;
border-radius:9px;
border:1px solid #ccd6dc;
font-size:15px;
}

button{
border:0;
color:white;
font-weight:bold;
cursor:pointer;
}

#selectButton{
background:#1769aa;
}

#routeButton{
background:#07855b;
margin-top:8px;
}

#mapContainer{
margin-top:16px;
background:white;
padding:10px;
border-radius:14px;
box-shadow:0 3px 12px #0002;
}

#map{
height:560px;
width:100%;
border-radius:10px;
}

.status{
margin-top:10px;
padding:14px;
background:#063b5c;
color:white;
border-radius:9px;
line-height:1.5;
}

.result{
display:none;
margin-top:15px;
background:white;
padding:16px;
border-radius:12px;
box-shadow:0 2px 8px #0001;
}

@media(max-width:800px){

.controls{
grid-template-columns:1fr;
}

#map{
height:450px;
}

}

</style>
</head>

<body>


<header>

<h1>🌊 FloodSafe Kochi</h1>

<p>
Emergency Shortest & Safest Route Planning System
</p>

</header>


<div class="container">


<div class="controls">


<div>

<label>USER LOCATION</label>

<button id="selectButton">

📍 SELECT LOCATION ON MAP

</button>

<div
id="locationText"
style="font-size:12px;margin-top:7px;color:#65747d">

Click the button and then click the map.

</div>

</div>


<div>

<label>EMERGENCY DESTINATION</label>

<input
id="destination"
value="Government Hospital, Ernakulam"
placeholder="Enter destination">

<button id="routeButton">

🚑 FIND ROUTE

</button>

</div>


<div>

<label>FLOOD CONDITION</label>

<select id="flood">

<option value="normal">
Normal
</option>

<option value="medium">
Medium Flood
</option>

<option value="severe">
Severe Flood
</option>

</select>

</div>

</div>


<div id="mapContainer">

<div id="map"></div>

<div
id="status"
class="status">

🗺️ Kochi map loaded.

<br><br>

Click
<strong>Select Location on Map</strong>
to select the emergency user's location.

</div>

</div>


<div
id="result"
class="result">

<strong>🚑 Route Result</strong>

<br><br>

Distance:
<strong id="distance">—</strong>

<br>

Travel Time:
<strong id="time">—</strong>

<br>

Flood Condition:
<strong id="floodResult">—</strong>

</div>


</div>


<!-- IMPORTANT:
     Leaflet JavaScript is loaded BEFORE our code.
-->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ==========================================
   STEP 1
   CREATE MAP
========================================== */

const map =
L.map("map");


/* ==========================================
   STEP 2
   OPENSTREETMAP
========================================== */

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,

attribution:
"&copy; OpenStreetMap contributors"
}
).addTo(map);


/* ==========================================
   STEP 3
   KOCHI
========================================== */

map.setView(
[9.9312,76.2673],
12
);


/* ==========================================
   VARIABLES
========================================== */

let userMarker = null;

let destinationMarker = null;

let routeLayer = null;

let selecting = false;

let userLocation = null;


/* ==========================================
   BUTTONS
========================================== */

const selectButton =
document.getElementById(
"selectButton"
);

const routeButton =
document.getElementById(
"routeButton"
);


/* ==========================================
   SELECT LOCATION
========================================== */

selectButton.onclick =
function(){

selecting = true;

selectButton.innerText =
"👆 CLICK ON MAP";

document.getElementById(
"status"
).innerHTML =

"<strong>📍 Select user location.</strong><br>" +

"Click anywhere on the Kochi map.";

};


/* ==========================================
   MAP CLICK
========================================== */

map.on(
"click",
function(event){

if(!selecting){

return;

}


const lat =
event.latlng.lat;

const lon =
event.latlng.lng;


userLocation = {

lat:lat,

lon:lon

};


/* Remove old marker */

if(userMarker){

map.removeLayer(
userMarker
);

}


/* Create marker */

userMarker =
L.marker(
[
lat,
lon
]
)
.addTo(map)
.bindPopup(
"<strong>📍 Emergency User</strong><br>" +

"Lat: " +
lat.toFixed(5) +

"<br>" +

"Lon: " +
lon.toFixed(5)
)
.openPopup();


selecting = false;


selectButton.innerText =
"📍 CHANGE LOCATION";


document.getElementById(
"locationText"
).innerHTML =

"✓ Location selected<br>" +

"Lat: " +
lat.toFixed(5) +

"<br>" +

"Lon: " +
lon.toFixed(5);


document.getElementById(
"status"
).innerHTML =

"<strong>✓ User location selected.</strong><br>" +

"Enter destination and click " +

"<strong>Find Route</strong>.";

});


/* ==========================================
   ROUTE BUTTON
========================================== */

routeButton.onclick =
findRoute;


/* ==========================================
   FIND ROUTE
========================================== */

async function findRoute(){

if(!userLocation){

alert(
"Please select the user location on the map."
);

return;

}


const destination =
document.getElementById(
"destination"
).value.trim();


if(!destination){

alert(
"Please enter a destination."
);

return;

}


routeButton.disabled =
true;


document.getElementById(
"status"
).innerText =

"🔎 Searching for destination...";


try{


/* ========================================
   GEOCODING
======================================== */

const searchURL =

"https://nominatim.openstreetmap.org/search" +

"?format=json" +

"&limit=1" +

"&q=" +

encodeURIComponent(
destination +
", Kochi, Kerala, India"
);


const searchResponse =
await fetch(
searchURL
);


const searchData =
await searchResponse.json();


if(searchData.length === 0){

throw new Error(
"Destination not found."
);

}


const destLat =
parseFloat(
searchData[0].lat
);

const destLon =
parseFloat(
searchData[0].lon
);


/* ========================================
   DESTINATION MARKER
======================================== */

if(destinationMarker){

map.removeLayer(
destinationMarker
);

}


destinationMarker =
L.marker(
[
destLat,
destLon
]
)
.addTo(map)
.bindPopup(
"<strong>🏥 Destination</strong><br>" +

destination
)
.openPopup();


/* ========================================
   OSRM ROUTING
======================================== */

document.getElementById(
"status"
).innerText =

"🚑 Calculating road route...";


const routeURL =

"https://router.project-osrm.org/route/v1/driving/" +

userLocation.lon +
"," +
userLocation.lat +

";" +

destLon +
"," +
destLat +

"?overview=full&geometries=geojson";


const routeResponse =
await fetch(
routeURL
);


const routeData =
await routeResponse.json();


if(
routeData.code !== "Ok" ||
!routeData.routes.length
){

throw new Error(
"No route found."
);

}


const route =
routeData.routes[0];


/* ========================================
   REMOVE OLD ROUTE
======================================== */

if(routeLayer){

map.removeLayer(
routeLayer
);

}


/* ========================================
   DRAW ROUTE
======================================== */

routeLayer =
L.geoJSON(
route.geometry,
{
style:{
color:"#08a568",
weight:8,
opacity:.9
}
}
).addTo(map);


/* ========================================
   ZOOM TO ROUTE
======================================== */

map.fitBounds(
routeLayer.getBounds(),
{
padding:[
30,
30
]
}
);


/* ========================================
   RESULTS
======================================== */

const distanceKm =
route.distance / 1000;

const minutes =
Math.round(
route.duration / 60
);


document.getElementById(
"result"
).style.display =
"block";


document.getElementById(
"distance"
).innerText =
distanceKm.toFixed(2) +
" km";


document.getElementById(
"time"
).innerText =
minutes +
" minutes";


document.getElementById(
"floodResult"
).innerText =
document.getElementById(
"flood"
).options[
document.getElementById(
"flood"
).selectedIndex
].text;


document.getElementById(
"status"
).innerHTML =

"<strong>✓ Route calculated successfully.</strong><br>" +

distanceKm.toFixed(2) +

" km • " +

minutes +

" minutes";


}

catch(error){

console.error(error);


document.getElementById(
"status"
).innerHTML =

"<strong>⚠️ Error</strong><br>" +

error.message;

}

finally{

routeButton.disabled =
false;

}

}

</script>

</body>
</html>
```
